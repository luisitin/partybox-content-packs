name: C01 historical sample pipeline
on:
  pull_request:
    paths:
      - 'jobs/C01-emergency-room/**'
      - '.github/workflows/C01.yml'
permissions:
  contents: read
jobs:
  sample-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jobs/C01-emergency-room
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: jobs/C01-emergency-room/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
